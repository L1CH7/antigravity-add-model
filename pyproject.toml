[project]
name = "antigravity-add-model"
version = "0.1.0"
description = "Antigravity Add-Model deployment and proxy manager"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
deploy-linux = "deploy_linux:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "deploy_linux.py",
]
